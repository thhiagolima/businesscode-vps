services:
  app:
    build:
      context: .
      target: app
    image: businesscode/app:dev
    env_file: [ ./backend/.env ]
    environment:
      CONTAINER_ROLE: app
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    image: businesscode/app:dev
    env_file: [ ./backend/.env ]
    environment:
      CONTAINER_ROLE: worker
    command: php artisan queue:work --queue=campaigns,messaging,billing,default --sleep=3 --tries=3 --timeout=3600 --max-time=3700
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_started }
    restart: unless-stopped

  scheduler:
    image: businesscode/app:dev
    env_file: [ ./backend/.env ]
    environment:
      CONTAINER_ROLE: scheduler
    command: php artisan schedule:work
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      nginx: { condition: service_started }
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: businesscode_saas
      MYSQL_USER: businesscode
      MYSQL_PASSWORD: businesscode_dev_password
      MYSQL_ROOT_PASSWORD: businesscode_root_dev_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  storage:
  frontend-node-modules:
